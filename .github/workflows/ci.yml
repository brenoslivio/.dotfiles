name: NixOS CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: ./.github/actions/nix-setup
        with:
          cache-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Shared evaluation and fast checks
        env:
          DOTFILES_FLAKE: git+file://${{ github.workspace }}?rev=${{ github.sha }}
        run: /usr/bin/time -v bash scripts/check.sh quick
  ahimsa-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: ./.github/actions/nix-setup
        with:
          kvm: 'true'
          cache-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Build desktop, Home Manager, and desktop VM
        env:
          DOTFILES_FLAKE: git+file://${{ github.workspace }}?rev=${{ github.sha }}
        run: /usr/bin/time -v bash scripts/check.sh ahimsa
      - name: Record desktop package inventory
        continue-on-error: true
        run: python3 scripts/package_inventory.py ahimsa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: packages-ahimsa-${{ github.run_attempt }}
          path: package-inventory.json
          if-no-files-found: warn
          retention-days: 90
      - name: Record post-merge desktop evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/ci-manifest.py ahimsa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: ahimsa-${{ github.sha }}-${{ github.run_attempt }}
          path: manifest.json
          if-no-files-found: error
          retention-days: 90
  vps-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: ./.github/actions/nix-setup
        with:
          kvm: 'true'
          cache-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Build server and validate proxy/VPN isolation
        env:
          DOTFILES_FLAKE: git+file://${{ github.workspace }}?rev=${{ github.sha }}
        run: /usr/bin/time -v bash scripts/check.sh ahimsa-vps
      - name: Record VPS package inventory
        continue-on-error: true
        run: python3 scripts/package_inventory.py ahimsa-vps
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: packages-ahimsa-vps-${{ github.run_attempt }}
          path: package-inventory.json
          if-no-files-found: warn
          retention-days: 90
      - name: Record post-merge VPS evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/ci-manifest.py ahimsa-vps
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: ahimsa-vps-${{ github.sha }}-${{ github.run_attempt }}
          path: manifest.json
          if-no-files-found: error
          retention-days: 90
  ahimsa-ready:
    if: always()
    needs: [checks, ahimsa-build, vps-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require shared checks and both hosts
        env:
          CHECKS: ${{ needs.checks.result }}
          DESKTOP: ${{ needs.ahimsa-build.result }}
          VPS: ${{ needs.vps-build.result }}
        run: test "$CHECKS" = success && test "$DESKTOP" = success && test "$VPS" = success
  ahimsa-vps-ready:
    if: always()
    needs: [checks, vps-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require VPS checks
        env:
          CHECKS: ${{ needs.checks.result }}
          VPS: ${{ needs.vps-build.result }}
        run: test "$CHECKS" = success && test "$VPS" = success
