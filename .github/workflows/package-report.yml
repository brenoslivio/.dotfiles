name: Weekly package report
on:
  workflow_run:
    workflows: [NixOS CI]
    types: [completed]
    branches: [automation/flake-update]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: weekly-package-report
  cancel-in-progress: false
jobs:
  report:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # All publication paths use the trusted main revision.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare validated inventories and retrieve bounded upstream notes
        run: python3 scripts/package_report.py render
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-package-report
          path: |
            package-report/report.md
            package-report/packages.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Update generated section if the PR is still current
        run: python3 scripts/package_report.py publish
