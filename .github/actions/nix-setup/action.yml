name: Nix runner setup
description: Prepare a hosted Nix runner
inputs:
  kvm:
    description: Require hardware virtualization for VM checks
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Prepare runner capacity
      shell: bash
      env:
        REQUIRE_KVM: ${{ inputs.kvm }}
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
        test "$(df --output=avail -B1 / | tail -1)" -ge 42949672960 || {
          echo 'At least 40 GiB free is required.' >&2; exit 1;
        }
        if [[ $REQUIRE_KVM == true ]]; then
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
        fi
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          max-jobs = 2
          cores = 2
          system-features = nixos-test benchmark big-parallel kvm
