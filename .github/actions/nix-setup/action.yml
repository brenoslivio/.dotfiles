name: Nix runner setup
description: Prepare a hosted Nix runner and the optional signed binary cache
inputs:
  cache-token:
    description: Cachix write token, passed only for trusted main pushes
    required: false
    default: ''
  kvm:
    description: Require hardware virtualization for VM checks
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Prepare runner capacity
      shell: bash
      env:
        REQUIRE_KVM: ${{ inputs.kvm }}
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
        test "$(df --output=avail -B1 / | tail -1)" -ge 42949672960 || {
          echo 'At least 40 GiB free is required.' >&2; exit 1;
        }
        if [[ $REQUIRE_KVM == true ]]; then
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
        fi
    - id: cache
      name: Read public cache configuration
      shell: bash
      run: python3 scripts/cache-config.py
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          max-jobs = 2
          cores = 2
          system-features = nixos-test benchmark big-parallel kvm
          extra-substituters = ${{ steps.cache.outputs.url }}
          extra-trusted-public-keys = ${{ steps.cache.outputs.key }}
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      if: steps.cache.outputs.name != ''
      with:
        name: ${{ steps.cache.outputs.name }}
        authToken: ${{ inputs.cache-token }}
        skipPush: ${{ inputs.cache-token == '' }}
        skipAddingSubstituter: true
