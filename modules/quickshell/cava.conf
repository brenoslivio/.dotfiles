[general]
bars = 64
framerate = 24
sleep_timer = 2
autosens = 1
sensitivity = 140
lower_cutoff_freq = 10
higher_cutoff_freq = 10000

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 255
bar_delimiter = 59
frame_delimiter = 10
channels = stereo

[smoothing]
# Give neighboring columns some response while keeping individual peaks distinct.
monstercat = 1.0
noise_reduction = 52
