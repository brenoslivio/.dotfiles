
# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/

$notebook = eDP-1
$external = HDMI-A-1

# Start with a valid non-overlapping fallback layout. hyprdocked.sh then
# keeps only one output enabled: HDMI when connected, otherwise the notebook. 2560x1080@60
monitor = $external, 2560x1080@60, 1920x0, 1
monitor = $notebook, 1920x1080@60, 0x0, 1

# Unmatched displays
monitor = , preferred, auto, 1

workspace = 1, persistent:true, default:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true
workspace = 6, persistent:true
###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nemo
$menu = rofi -show drun -switchers drun -show-icons -modes drun,calc
$lock = loginctl lock-session

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = hyprpaper &
exec-once = lxqt-policykit-agent &
exec-once = clipse -listen &
exec-once = nm-applet --indicator &
exec-once = dropbox &
exec-once = protonvpn-app &
exec-once = sleep 5s && blueman-applet &
exec-once = kdeconnectd &
exec-once = kdeconnect-indicator & 
exec-once = [workspace special:dropdown silent] $terminal --class dropdown 

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,30
env = HYPRCURSOR_SIZE,30
env = HYPRSHOT_DIR,Pictures/Screenshots
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 15

    border_size = 3

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(de0be6ee) rgba(de0be6ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 5
        render_power = 3
        color = rgba(ca25e8ee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 4
        passes = 3

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.94, almostLinear, slidevert
    animation = workspacesOut, 1, 1.94, almostLinear, slidevert

    animation = specialWorkspace, 1, 8, default, slidefadevert -50%
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# These examples use the pre-0.55 rule syntax; convert them to named
# `windowrule { ... }` blocks before enabling them.

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    # hostname: ahimsa
    kb_layout = us
    kb_variant =
    kb_model =
    # kb_layout = br
    # kb_variant = abnt2
    # kb_model = thinkpad
    # hostname: ahimsa-ufz
    # kb_layout = de
    # kb_variant = 
    # kb_model = pc105
    kb_options =
    kb_rules =
    numlock_by_default = true

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = false
# }

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, $mainMod_L, exec, pkill rofi || $menu
# bind = $mainMod, X, exec, bash -c 'bash -c "$(grep '^Exec=' ~/.local/share/applications/brave-cadlkienfkclaiaibeoongdcgmdikeeg-Default.desktop | sed 's/^Exec=//')"'
bind = , PRINT, exec, hyprshot -m output
bind = SHIFT, PRINT, exec, hyprshot -m region

bind = $mainMod, L, exec, $lock
bindl = , switch:on:Lid Switch, exec, $lock

bind = SUPER, B, exec, $terminal --class clipse -e 'clipse'

bind  = , XF86PowerOff, exec, wlogout

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, W, exec, ~/.config/waybar/launch.sh
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, D, exec, $terminal --class dropdown
#bind = $mainMod, SPACE, exec, pkill cava || $terminal --class cava-waybar cava
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, Z, togglespecialworkspace, dropdown
bind = $mainMod, S, togglespecialworkspace, deepseek
bind = $mainMod, T, togglespecialworkspace, deepl

bind = $mainMod SHIFT, S, movetoworkspace, special:dropdown

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_up, workspace, e+1
bind = $mainMod, mouse_down, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, F, fullscreen

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2 * 100)}' | xargs -I[] notify-send -e -u low -h string:x-canonical-private-synchronous:volume_notif -h int:value:[] "🔊 Volume : []%"
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2 * 100)}' | xargs -I[] notify-send -e -u low -h string:x-canonical-private-synchronous:volume_notif -h int:value:[] "🔊 Volume : []%"
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules


windowrule {
    name = authentication-dialog
    match:title = ^(Authentication Required)$
    float = true
}

windowrule {
    name = blueman-manager
    match:class = ^(.blueman-manager-wrapped)$
    float = true
}

windowrule {
    name = pavucontrol
    match:class = ^(org.pulseaudio.pavucontrol)$
    float = true
}

windowrule {
    name = kcalc
    match:class = ^(org.kde.kcalc)$
    float = true
}

windowrule {
    name = dropdown-terminal
    match:class = ^(dropdown)$
    float = true
    size = monitor_w*0.5 monitor_h*0.5
    move = monitor_w*0.25 monitor_h*0.08
    workspace = special:dropdown
}

windowrule {
    name = deepseek
    match:initial_title = ^(DeepSeek)$
    float = true
    size = monitor_w*0.5 monitor_h*0.5
    move = monitor_w*0.25 monitor_h*0.08
    workspace = special:deepseek
}

windowrule {
    name = deepl
    match:class = ^(brave-bllmiclhkidahfhjpfcipplbebkfhafn-Default)$
    float = true
    size = monitor_w*0.5 monitor_h*0.5
    move = monitor_w*0.25 monitor_h*0.08
    workspace = special:deepl
}

windowrule {
    name = cava-waybar
    match:class = ^(cava-waybar)$
    pin = true
    float = true
    size = monitor_w*0.985 monitor_h*0.04
    move = monitor_w*0.0075 monitor_h*0.014
    no_initial_focus = true
    no_focus = true
}

windowrule {
    name = clipse
    match:class = ^(clipse)$
    float = true
    size = 622 652
}

# Ignore maximize requests from apps.
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland.
windowrule {
    name = xwayland-drag-focus
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

layerrule {
    name = waybar-blur
    match:namespace = ^(waybar)$
    blur = true
}

layerrule {
    name = rofi-blur
    match:namespace = ^(rofi)$
    blur = true
}

layerrule {
    name = hyprpicker-no-animation
    match:namespace = ^(hyprpicker)$
    no_anim = true
}

layerrule {
    name = selection-no-animation
    match:namespace = ^(selection)$
    no_anim = true
}
