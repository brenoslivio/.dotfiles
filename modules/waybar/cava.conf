[general]
bars = 10
framerate = 30
autosens = 1
sensitivity = 100
lower_cutoff_freq = 10
higher_cutoff_freq = 10000

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10
channels = stereo

[smoothing]
noise_reduction = 0.2
